[server]
# Only reachable from the VM itself; the researcher uses an SSH tunnel. Never expose this port.
address = "127.0.0.1"
port = 8501
headless = true
runOnSave = false
maxUploadSize = 200  # MB per file; keep equal to uploads.MAX_BYTES

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[theme]
base = "light"
primaryColor = "#2a78d6"

[client]
toolbarMode = "minimal"

[global]
# Never cache ForwardMsgs: with 5 s fragment reruns, cached large messages (3D view) expired after 2 reruns and the
# browser hit "Cached ForwardMsg MISS". Re-sending them costs a little bandwidth over the tailnet only.
minCachedMessageSize = 1000000000000
